<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../Styles/payrollForm.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center" role="button" onclick="goToHomePage()">
                <img src="https://img.icons8.com/ios-filled/50/000000/payroll.png" alt="Logo" width="40"
                    class="me-2 d-block border border-2 border-success rounded-1" />
                <div>
                    <h4 class="m-0 fs-6 fw-bolder light-green-font">EMPLOYEE</h4>
                    <h4 class="m-0 fs-6 fw-bolder">PAYROLL</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-body-secondary container-fluid py-4">
        <div class="container bg-white rounded-2 py-4 px-5">
            <form class="px-5" id="payroll-form" method="post">
                <h5 class="my-3 pb-3 fw-bold">Employee Payroll Form</h5>
                <div class="row mb-4">
                    <label for="inputName" class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputName">
                    </div>
                </div>

                <fieldset class="mb-4">
                    <label for="inputName" class="col-sm-2 col-form-label">Profile Image</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="profileImageOptions" id="inlineRadio1"
                            value="face1.jpg">
                        <label class="form-check-label" for="inlineRadio1"><img class="radio-btn-img"
                                src="../Assets/face1.jpg" alt=""></label>
                    </div>
                    <div class="form-check form-check-inline mx-4">
                        <input class="form-check-input" type="radio" name="profileImageOptions" id="inlineRadio2"
                            value="face2.jpg">
                        <label class="form-check-label" for="inlineRadio2"> <img class="radio-btn-img"
                                src="../Assets/face2.jpg" alt=""> </label>
                    </div>
                    <div class="form-check form-check-inline mx-4">
                        <input class="form-check-input" type="radio" name="profileImageOptions" id="inlineRadio3"
                            value="face3.jpg">
                        <label class="form-check-label" for="inlineRadio3"><img class="radio-btn-img"
                                src="../Assets/face3.jpg" alt=""></label>
                    </div>
                    <div class="form-check form-check-inline mx-4">
                        <input class="form-check-input" type="radio" name="profileImageOptions" id="inlineRadio4"
                            value="face4.webp">
                        <label class="form-check-label" for="inlineRadio4"><img class="radio-btn-img"
                                src="../Assets/face4.webp" alt=""></label>
                    </div>
                </fieldset>

                <fieldset class="mb-4">
                    <label for="inputName" class="col-sm-2 col-form-label">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="genderRadioOptions" id="genderRadio1"
                            value="male">
                        <label class="form-check-label" for="genderRadio1">Male</label>
                    </div>
                    <div class="form-check form-check-inline mx-4">
                        <input class="form-check-input" type="radio" name="genderRadioOptions" id="genderRadio2"
                            value="female">
                        <label class="form-check-label" for="genderRadio2">Female</label>
                    </div>
                </fieldset>

                <div class="mb-4">
                    <label for="inputName" class="col-sm-2 col-form-label">Department</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="inlineCheckbox1" name="departmentOptions"
                            value="hr">
                        <label class="form-check-label" for="inlineCheckbox1">HR</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="inlineCheckbox2" name="departmentOptions"
                            value="sales">
                        <label class="form-check-label" for="inlineCheckbox2">Sales</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="inlineCheckbox3" name="departmentOptions"
                            value="finance">
                        <label class="form-check-label" for="inlineCheckbox3">Finance</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="inlineCheckbox4" name="departmentOptions"
                            value="engineers">
                        <label class="form-check-label" for="inlineCheckbox3">Engineers</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="inlineCheckbox5" name="departmentOptions"
                            value="others">
                        <label class="form-check-label" for="inlineCheckbox3">Others</label>
                    </div>
                </div>

                <div class="row mb-4 align-items-center">
                    <label for="salaryRange" class="col-sm-2 col-form-label">Salary</label>
                    <div class="col-sm-4">
                        <select id="salaryRange" class="form-select">
                            <option value="">Select salary range</option>
                            <option value="10000">10000</option>
                            <option value="20000">20000</option>
                            <option value="30000">30000</option>
                            <option value="40000">40000</option>
                            <option value="50000">50000</option>
                        </select>
                    </div>
                </div>


                <div class="row mb-4 align-items-center">
                    <label for="startDate" class="col-sm-2 col-form-label">Start Date</label>
                    <div class="col-sm-10">
                        <div class="d-flex gap-2">
                            <!-- Day Dropdown -->
                            <select class="form-select w-auto" id="day">
                                <option value="">Day</option>
                                <!-- Days 1 to 31 -->
                                <script>
                                    for (let i = 1; i <= 31; i++) {
                                        document.write(`<option value="${i}">${i}</option>`);
                                    }
                                </script>
                            </select>

                            <!-- Month Dropdown -->
                            <select class="form-select w-auto" id="month">
                                <option value="">Month</option>
                                <option value="1">January</option>
                                <option value="2">February</option>
                                <option value="3">March</option>
                                <option value="4">April</option>
                                <option value="5">May</option>
                                <option value="6">June</option>
                                <option value="7">July</option>
                                <option value="8">August</option>
                                <option value="9">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>

                            <!-- Year Dropdown -->
                            <select class="form-select w-auto" id="year">
                                <option value="">Year</option>
                                <!-- Years 1980 to current -->
                                <script>
                                    for (let y = new Date().getFullYear(); y >= 1980; y--) {
                                        document.write(`<option value="${y}">${y}</option>`);
                                    }
                                </script>
                            </select>
                        </div>
                    </div>
                </div>


                <div class="row mb-4">
                    <label for="inputnotes" class="col-sm-2 col-form-label">Notes</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" id="Textarea1" rows="3"></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-5">
                    <div class="d-inline-block">
                        <button type="button" class="btn btn-secondary px-5" onclick="goToHomePage()">Cancel</button>
                    </div>
                    <div class="d-inline-block">
                        <button type="submit" class="btn btn-secondary px-5 me-5">Submit</button>
                        <button type="button" class="btn btn-secondary px-5" onclick="resetForm()">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../Scripts/payrollForm.js"></script>
</body>

</html>
